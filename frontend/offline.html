<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Offline — Aetheris</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="/static/tailwind.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center">
  <div class="glass rounded-2xl p-8 max-w-md mx-4 text-center">
    <div class="text-6xl mb-4">🌌</div>
    <h1 class="text-2xl font-bold text-cyan-300 mb-2">Offline</h1>
    <p class="text-slate-400 mb-6">
      Aetheris tidak dapat terhubung ke server. Cek koneksi internet Anda, lalu coba lagi.
    </p>
    <button onclick="location.reload()"
      class="w-full bg-gradient-to-r from-cyan-500 to-purple-600 hover:from-cyan-400 hover:to-purple-500 text-white font-semibold py-3 rounded-lg">
      🔄 Coba Lagi
    </button>
  </div>
</body>
</html>
